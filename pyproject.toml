[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exact-linter"
version = "0.2.0"
description = "Finds magic float constants in Python code (pi/180, 1/ln 2, 2/3, ...) and suggests exact, readable replacements."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Keith Adler" }]
requires-python = ">=3.10"
dependencies = ["mpmath>=1.3.0", "tomli>=2.0; python_version < '3.11'"]
keywords = ["linter", "constants", "pslq", "static-analysis", "floating-point"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4,<0.17", "flake8>=7"]

[project.scripts]
exact = "exact_linter.cli:main"

[project.entry-points."flake8.extension"]
EXA = "exact_linter.flake8_plugin:ExactChecker"

[project.urls]
Homepage = "https://github.com/keithadler/magic-float-linter"

[tool.hatch.build.targets.wheel]
packages = ["src/exact_linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# State the rule set explicitly rather than inheriting ruff's default, which
# is not stable across releases: 0.16 widened it to include isort, pylint,
# flake8-simplify and flake8-blind-except, and CI started failing on code
# that had not changed. The blind `except Exception` around eval()/pslq() is
# deliberate - a linter must degrade to None, never crash on user input.
select = ["E4", "E7", "E9", "F"]
